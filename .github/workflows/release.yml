name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset-name: neon-context-server-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset-name: neon-context-server-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            asset-name: neon-context-server-macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cd server
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp server/target/${{ matrix.target }}/release/neon-context-server dist/
          cd dist && tar czf ../${{ matrix.asset-name }}.tar.gz neon-context-server

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset-name }}.tar.gz
